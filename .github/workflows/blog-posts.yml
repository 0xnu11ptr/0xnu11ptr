name: Latest blog posts

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-readme:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: gautamkrishnar/blog-post-workflow@v1
        with:
          feed_list: "https://0xnu11ptr.github.io/feed.xml"
          max_post_count: 5
          commit_message: "update latest blog posts"
          committer_username: "0xnu11ptr"
